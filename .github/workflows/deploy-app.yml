name: Deploy Application

# SECURITY MODEL
# - The pipeline holds exactly one SSH key (ci-deploy) and no passwords.
# - It cannot read vault, cannot become root, cannot change infrastructure.
# - It runs two root-owned scripts: erp-deploy and erp-smoke.
# - Production requires approval from a designated reviewer (no self-review).
# - Production runs only when explicitly requested via workflow_dispatch.
#   A development deployment never triggers or queues production.
# - A rollback is a deploy of an older version tag. There is no separate job.

on:
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version tag (e.g. 1.16.11 or v1.16.11) or sha256 digest'
        required: false
        type: string
      digest:
        description: 'Immutable Docker image digest (sha256:<64 hex characters>), alternative to version'
        required: false
        type: string
      environment:
        description: 'Target environment for initial deploy'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production

permissions:
  contents: read
  # No secrets, no vault, no become password

# Never let two deploys to the same environment run concurrently.
concurrency:
  group: deploy-app-${{ github.event.inputs.environment || github.event.client_payload.environment || 'development' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare & Validate
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.validate.outputs.image_ref }}
      ref_type: ${{ steps.validate.outputs.ref_type }}
      environment: ${{ steps.validate.outputs.environment }}
      actor: ${{ steps.validate.outputs.actor }}
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Validate dispatch payload
        id: validate
        env:
          # Event payloads are untrusted input. Pass them as environment
          # variables so the shell never parses their contents as code.
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          PAYLOAD_DIGEST: ${{ github.event.client_payload.digest }}
          PAYLOAD_ENVIRONMENT: ${{ github.event.client_payload.environment }}
          PAYLOAD_ACTOR: ${{ github.event.client_payload.actor }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_DIGEST: ${{ github.event.inputs.digest }}
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          DEFAULT_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            if [ -n "$PAYLOAD_VERSION" ] && [ -n "$PAYLOAD_DIGEST" ]; then
              echo "::error::Provide either client_payload.version or client_payload.digest in repository_dispatch, not both"
              exit 1
            fi
            if [ -z "$PAYLOAD_VERSION" ] && [ -z "$PAYLOAD_DIGEST" ]; then
              echo "::error::Missing client_payload.version or client_payload.digest in repository_dispatch event"
              exit 1
            fi
            if [ -z "$PAYLOAD_ENVIRONMENT" ]; then
              echo "::error::Missing client_payload.environment in repository_dispatch event (must be exactly 'development')"
              exit 1
            fi
            if [ "$PAYLOAD_ENVIRONMENT" != "development" ]; then
              echo "::error::Automated repository_dispatch can only deploy to 'development'. Received: '$PAYLOAD_ENVIRONMENT'"
              exit 1
            fi
            if [ -n "$PAYLOAD_DIGEST" ]; then
              RAW_REF="$PAYLOAD_DIGEST"
              INPUT_SOURCE="digest"
            else
              RAW_REF="$PAYLOAD_VERSION"
              INPUT_SOURCE="auto"
            fi
            ENV="$PAYLOAD_ENVIRONMENT"
            ACTOR="${PAYLOAD_ACTOR:-$DEFAULT_ACTOR}"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_VERSION" ] && [ -n "$INPUT_DIGEST" ]; then
              echo "::error::Provide either 'version' or 'digest' input in workflow_dispatch, not both"
              exit 1
            fi
            if [ -z "$INPUT_VERSION" ] && [ -z "$INPUT_DIGEST" ]; then
              echo "::error::Missing image input in workflow_dispatch: provide either 'version' or 'digest'"
              exit 1
            fi
            if [ -z "$INPUT_ENVIRONMENT" ]; then
              echo "::error::Missing environment input in workflow_dispatch"
              exit 1
            fi
            if [ -n "$INPUT_DIGEST" ]; then
              RAW_REF="$INPUT_DIGEST"
              INPUT_SOURCE="digest"
            else
              RAW_REF="$INPUT_VERSION"
              INPUT_SOURCE="auto"
            fi
            ENV="$INPUT_ENVIRONMENT"
            ACTOR="$DEFAULT_ACTOR"
          else
            echo "::error::Unsupported event trigger: $EVENT_NAME"
            exit 1
          fi

          # Validate either an immutable sha256 digest or a semantic version tag.
          # A digest is never treated as a semantic version.
          if [ "$INPUT_SOURCE" = "digest" ] || [[ "$RAW_REF" =~ ^[Ss][Hh][Aa]256: ]]; then
            DIGEST="$(printf '%s' "$RAW_REF" | tr '[:upper:]' '[:lower:]')"
            if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid digest format: '$RAW_REF'. Must be 'sha256:' followed by 64 hexadecimal characters."
              exit 1
            fi
            IMAGE_REF="$DIGEST"
            REF_TYPE="digest"
          else
            # Strip optional leading 'v'
            VERSION="${RAW_REF#v}"

            # Validate version format (semver required, latest forbidden)
            if [ "$VERSION" = "latest" ]; then
              echo "::error::The 'latest' tag is forbidden for deployments. Must be a semantic version (e.g. 1.16.11) or sha256 digest."
              exit 1
            fi

            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid version or digest format: '$RAW_REF'. Must be a valid semantic version (e.g. 1.16.11 or v1.16.11) or sha256 digest (sha256:<64 hex chars>)."
              exit 1
            fi

            IMAGE_REF="$VERSION"
            REF_TYPE="version"
          fi

          if [[ ! "$ENV" =~ ^(development|production)$ ]]; then
            echo "::error::Invalid environment: $ENV"
            exit 1
          fi

          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "ref_type=$REF_TYPE" >> "$GITHUB_OUTPUT"
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "actor=$ACTOR" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = "digest" ]; then
            SUMMARY_LABEL="Digest"
          else
            SUMMARY_LABEL="Version"
          fi
          {
            echo "### Deploy summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| $SUMMARY_LABEL | \`$IMAGE_REF\` |"
            echo "| Reference type | \`$REF_TYPE\` |"
            echo "| Environment | \`$ENV\` |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Actor | $ACTOR |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Validated: ${REF_TYPE}=${IMAGE_REF} environment=${ENV}"

  deploy-development:
    name: Deploy Development
    needs: prepare
    if: needs.prepare.outputs.environment == 'development'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Resolve credentials from environment secrets
        env:
          CI_DEPLOY_SSH_KEY: ${{ secrets.CI_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "$CI_DEPLOY_SSH_KEY" ]; then
            echo "::error::Secret CI_DEPLOY_SSH_KEY is not set on the 'development' environment."
            exit 1
          fi

          # Mask before the values can ever reach the log.
          while IFS= read -r line; do
            [ -n "$line" ] && printf '::add-mask::%s\n' "$line"
          done <<< "$CI_DEPLOY_SSH_KEY"

          install -d -m 700 ~/.ssh
          printf '%s\n' "$CI_DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Validate the key parses without ever printing its contents.
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null && echo "SSH private key parsed OK"

      - name: Verify non-secret runtime variables are present
        env:
          TARGET_SERVER_HOST: ${{ vars.TARGET_SERVER_HOST }}
          CI_DEPLOY_USER: ${{ vars.CI_DEPLOY_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          set -euo pipefail
          set +x
          for v in TARGET_SERVER_HOST CI_DEPLOY_USER SSH_PORT; do
            if [ -z "${!v}" ]; then
              echo "::error::Variable $v is not set. Add it under Settings -> Environments -> development -> Variables."
              exit 1
            fi
          done
          echo "Runtime identity variables present (values not shown)"

      - name: Deploy application image
        env:
          TARGET_SERVER_HOST: ${{ vars.TARGET_SERVER_HOST }}
          CI_DEPLOY_USER: ${{ vars.CI_DEPLOY_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          IMAGE_REF: ${{ needs.prepare.outputs.image_ref }}
          DEPLOY_ACTOR: ${{ needs.prepare.outputs.actor }}
          DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          set +x
          # The ci-deploy sudo rule preserves only these two metadata
          # variables, which the host script writes to its audit log.
          REMOTE="DEPLOY_ACTOR=$(printf %q "$DEPLOY_ACTOR") DEPLOY_RUN_URL=$(printf %q "$DEPLOY_RUN_URL") sudo -n /usr/local/bin/erp-deploy \"$IMAGE_REF\""
          ssh -o StrictHostKeyChecking=accept-new \
            -i ~/.ssh/id_deploy \
            -p "$SSH_PORT" \
            "$CI_DEPLOY_USER@$TARGET_SERVER_HOST" \
            "$REMOTE"

      - name: Smoke test development
        env:
          TARGET_SERVER_HOST: ${{ vars.TARGET_SERVER_HOST }}
          CI_DEPLOY_USER: ${{ vars.CI_DEPLOY_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          set -euo pipefail
          set +x
          ssh -o StrictHostKeyChecking=accept-new \
            -i ~/.ssh/id_deploy \
            -p "$SSH_PORT" \
            "$CI_DEPLOY_USER@$TARGET_SERVER_HOST" \
            "sudo -n /usr/local/bin/erp-smoke"

  deploy-production:
    name: Deploy Production
    needs: [prepare]
    # Production runs ONLY when explicitly requested through workflow_dispatch with environment production.
    # A development deployment never triggers or queues production.
    if: |
      github.event_name == 'workflow_dispatch' &&
      needs.prepare.outputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    # Requires reviewer approval; self-review disabled in environment settings
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Resolve credentials from environment secrets
        env:
          CI_DEPLOY_SSH_KEY: ${{ secrets.CI_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "$CI_DEPLOY_SSH_KEY" ]; then
            echo "::error::Secret CI_DEPLOY_SSH_KEY is not set on the 'production' environment."
            exit 1
          fi

          # Mask before the values can ever reach the log.
          while IFS= read -r line; do
            [ -n "$line" ] && printf '::add-mask::%s\n' "$line"
          done <<< "$CI_DEPLOY_SSH_KEY"

          install -d -m 700 ~/.ssh
          printf '%s\n' "$CI_DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Validate the key parses without ever printing its contents.
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null && echo "SSH private key parsed OK"

      - name: Verify non-secret runtime variables are present
        env:
          TARGET_SERVER_HOST: ${{ vars.TARGET_SERVER_HOST }}
          CI_DEPLOY_USER: ${{ vars.CI_DEPLOY_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          set -euo pipefail
          set +x
          for v in TARGET_SERVER_HOST CI_DEPLOY_USER SSH_PORT; do
            if [ -z "${!v}" ]; then
              echo "::error::Variable $v is not set. Add it under Settings -> Environments -> production -> Variables."
              exit 1
            fi
          done
          echo "Runtime identity variables present (values not shown)"

      - name: Deploy application image
        env:
          TARGET_SERVER_HOST: ${{ vars.TARGET_SERVER_HOST }}
          CI_DEPLOY_USER: ${{ vars.CI_DEPLOY_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          IMAGE_REF: ${{ needs.prepare.outputs.image_ref }}
          DEPLOY_ACTOR: ${{ needs.prepare.outputs.actor }}
          DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          set +x
          # The ci-deploy sudo rule preserves only these two metadata
          # variables, which the host script writes to its audit log.
          REMOTE="DEPLOY_ACTOR=$(printf %q "$DEPLOY_ACTOR") DEPLOY_RUN_URL=$(printf %q "$DEPLOY_RUN_URL") sudo -n /usr/local/bin/erp-deploy \"$IMAGE_REF\""
          ssh -o StrictHostKeyChecking=accept-new \
            -i ~/.ssh/id_deploy \
            -p "$SSH_PORT" \
            "$CI_DEPLOY_USER@$TARGET_SERVER_HOST" \
            "$REMOTE"

      - name: Smoke test production
        env:
          TARGET_SERVER_HOST: ${{ vars.TARGET_SERVER_HOST }}
          CI_DEPLOY_USER: ${{ vars.CI_DEPLOY_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          set -euo pipefail
          set +x
          ssh -o StrictHostKeyChecking=accept-new \
            -i ~/.ssh/id_deploy \
            -p "$SSH_PORT" \
            "$CI_DEPLOY_USER@$TARGET_SERVER_HOST" \
            "sudo -n /usr/local/bin/erp-smoke"

  record:
    name: Record release
    needs: [prepare, deploy-production]
    if: needs.deploy-production.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the deployed reference
        run: |
          {
            echo "### Release deployed"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Reference type | \`${{ needs.prepare.outputs.ref_type }}\` |"
            echo "| Reference | \`${{ needs.prepare.outputs.image_ref }}\` |"
            echo "| Environment | \`${{ needs.prepare.outputs.environment }}\` |"
            echo "| Actor | \`${{ needs.prepare.outputs.actor }}\` |"
            echo "| Run | ${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"
