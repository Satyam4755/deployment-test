---
# Lowest-precedence safe defaults. Overridden by group_vars/all, group_vars/<env>.
traefik_image: "traefik:v3.7.13"
traefik_uid: "65532"
traefik_gid: "65532"
socket_proxy_image: "lscr.io/linuxserver/socket-proxy:3.4.7"
traefik_bouncer_version: "v1.8.1"
traefik_bouncer_plugin: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
traefik_cert_resolver: "cloudflare"
traefik_crowdsec_enabled: false
traefik_log_level: "INFO"
traefik_cpus_limit: "1.00"
traefik_memory_limit: "512M"
traefik_rate_average: 20
traefik_rate_burst: 40
frappe_rate_average: 50
frappe_rate_burst: 100
# Network that only Traefik and CrowdSec share. The app containers cannot
# reach the CrowdSec API because they are not on it.
traefik_crowdsec_network: "crowdsec-net"
# CrowdSec bouncer plugin settings (docs/roles/traefik.md). Fail-closed by
# default: no request is served while the decision stream or AppSec is
# unavailable.
traefik_bouncer_mode: "stream"
traefik_bouncer_update_interval: 10
traefik_bouncer_update_max_failure: 0
traefik_bouncer_stream_startup_block: true
traefik_bouncer_appsec_enabled: true
traefik_bouncer_appsec_host: "crowdsec:7422"
traefik_bouncer_appsec_failure_block: true
traefik_bouncer_appsec_unreachable_block: true
traefik_bouncer_appsec_body_limit: 10485760
traefik_bouncer_appsec_unreadable_body_block: true
tz: "UTC"
