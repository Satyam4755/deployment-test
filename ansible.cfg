[defaults]
inventory = ./inventory/inventory.yml
roles_path = ./roles:.
host_key_checking = False
# NOTE: do not use `stdout_callback = yaml` — that callback moved to
# community.general and was removed in v12. Use result_format instead.
result_format = yaml
callbacks_enabled = profile_tasks
forks = 20
pipelining = True
vault_id_match = True
# Never echo module arguments to stdout: they may contain resolved secrets.
display_args_to_stdout = False

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
retries = 3
